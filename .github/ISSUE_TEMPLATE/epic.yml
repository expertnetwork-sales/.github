name: Epic
description: A shippable body of work; parent of Features, Tasks and Bugs.
title: "[Epic]: "
type: Epic
body:
  - type: markdown
    attributes:
      value: |
        An Epic groups Features, Tasks and Bugs that ship together. After creating it, add child issues as **sub-issues** and link it to its parent **Initiative**.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What will be true for users or the business when this ships?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: The pieces of work in this Epic (convert to sub-issues as they are created).
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: metrics
    attributes:
      label: Success metrics
      description: How will we measure success?
    validations:
      required: true
