name: Initiative
description: A portfolio-level outcome spanning a quarter or more; parent of Epics.
title: "[Initiative]: "
type: Initiative
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: The business or customer outcome this Initiative delivers.
    validations:
      required: true
  - type: textarea
    id: why-now
    attributes:
      label: Why now
      description: What makes this the right time? What happens if we wait?
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Success metrics
      value: |
        - 
    validations:
      required: true
  - type: dropdown
    id: quarter
    attributes:
      label: Target quarter
      options:
        - 2026 Q4
        - 2027 Q1
        - 2027 Q2
        - 2027 Q3
        - 2027 Q4
    validations:
      required: true
  - type: textarea
    id: epics
    attributes:
      label: Epics
      description: Child Epics (add them as sub-issues).
