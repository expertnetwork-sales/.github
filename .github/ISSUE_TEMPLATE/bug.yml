name: Bug report
description: Something is broken or behaves differently from what it should.
title: "[Bug]: "
type: Bug
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please give enough detail to reproduce. Never paste secrets, API keys, or private expert/client data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. Include job IDs (e.g. `ANS-...`) where relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Send job ...
        2. ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / surface
      multiple: true
      options:
        - Worker (API / Workflow)
        - MCP server
        - Web
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit / deployment
      description: Git SHA, Worker version ID, or migration number.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste logs here; they are rendered as code automatically.
      render: shell
